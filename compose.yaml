services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docflow_local}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - docflow_pgdata:/var/lib/postgresql/data

volumes:
  docflow_pgdata:
